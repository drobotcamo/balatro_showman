name: planning-check

on:
  push:
    paths:
      - "planning/**"
      - "tools/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/planning-check.yml"
      - "alembic/**"
      - "ground_truth/file_ipc_bridge.py"
      - "ground_truth/balatro_mod/**"
      - "run_bundle/**"
      - "tests/test_file_ipc_bridge.py"
      - "tests/test_balatro_mod.py"
      - "tests/lua_file_ipc_fixture/**"
      - "tests/test_run_bundle*.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - "planning/**"
      - "tools/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/planning-check.yml"
      - "alembic/**"
      - "ground_truth/file_ipc_bridge.py"
      - "ground_truth/balatro_mod/**"
      - "run_bundle/**"
      - "tests/test_file_ipc_bridge.py"
      - "tests/test_balatro_mod.py"
      - "tests/lua_file_ipc_fixture/**"
      - "tests/test_run_bundle*.py"
      - "pyproject.toml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "SQLAlchemy>=2.0,<3" "alembic>=1.13,<2" "pytest>=9,<10" "jsonschema>=4.26,<5"
      - run: python -m pytest -q tests/test_file_ipc_bridge.py tests/test_balatro_mod.py tests/test_run_bundle*.py
      - run: python -m pytest -q tests/test_evaluation_manifest.py
      - run: python3 tools/issue_tags.py check
      - run: python3 planning/check_contracts.py
