name: planning-check

on:
  push:
    paths:
      - "planning/**"
      - "tools/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/planning-check.yml"
  pull_request:
    paths:
      - "planning/**"
      - "tools/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/planning-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/issue_tags.py check
      - run: python3 planning/check_contracts.py
